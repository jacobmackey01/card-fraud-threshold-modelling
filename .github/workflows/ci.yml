name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q service scripts src tests
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Verify promoted model bundle
        run: python -m scripts.promote_model --version 1.0.0 --check
      - name: Run synthetic pipeline smoke test
        run: python src/smoke_test.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the synthetic rehearsal image
        run: |
          docker build \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg MODEL_VERSION=1.0.0 \
            --build-arg MODEL_FILE_SHA256=9800efa3737531fdd0df78bcbb782dd0108cbfca593a76d33f0f534a1842645d \
            --tag fraud-review-api:${{ github.sha }} .
      - name: Verify the API from inside the built container
        run: |
          image_digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          docker run --detach --rm --name fraud-review-api -p 8080:8080 \
            -e SYNTHETIC_DEMO_ONLY=true \
            -e DEPLOYED_GIT_COMMIT=${{ github.sha }} \
            -e DEPLOYED_IMAGE_DIGEST=${image_digest} \
            fraud-review-api:${{ github.sha }}
          trap 'docker logs fraud-review-api; docker stop fraud-review-api' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          python -m scripts.verify_deployment \
            --base-url http://127.0.0.1:8080 \
            --expected-commit "${{ github.sha }}" \
            --expected-container-digest "${image_digest}" \
            --expected-model-release 1.0.0 \
            --expected-model-file-digest 9800efa3737531fdd0df78bcbb782dd0108cbfca593a76d33f0f534a1842645d \
            --expected-threshold 0.053668899607021495 \
            --expected-fixture synthetic-demo-v1 \
            --output /tmp/container-verification.json
