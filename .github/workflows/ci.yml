name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q service scripts src tests
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Verify promoted model bundle
        run: python -m scripts.promote_model --version 1.0.0 --check
      - name: Run synthetic pipeline smoke test
        run: python src/smoke_test.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag fraud-review-api:${{ github.sha }} .
